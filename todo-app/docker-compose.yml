services:
  backend:
    build:
      context: ./backend
    container_name: todo-app-backend
    ports:
      - "8080:8080"
    volumes:
      - todo-db:/app/data
    environment:
      - SPRING_PROFILES_ACTIVE=docker

  frontend:
    build:
      context: ./frontend
    container_name: todo-app-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8080

volumes:
  todo-db:
